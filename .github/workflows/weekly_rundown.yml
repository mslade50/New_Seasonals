name: Weekly Market Rundown
run-name: "Weekly Market Rundown — ${{ inputs.automation_token || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

jobs:
  weekly_rundown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaleido fpdf2 markdown

      - name: Run weekly rundown
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python weekly_market_rundown.py
