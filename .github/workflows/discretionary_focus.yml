name: Discretionary Focus
run-name: "Discretionary Focus (${{ inputs.delivery_mode || 'dry_run' }}) — ${{ inputs.automation_token || 'manual' }}"

# One pre-market, research-only attention list.  This workflow has no broker,
# Sheets, strategy-scanner, allocation, or order-staging dependency.
on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string
      delivery_mode:
        description: Manual runs are diagnostics unless current-session delivery is explicit
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - publish_and_email

concurrency:
  group: discretionary-focus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-publish-email:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install bounded dependencies
        run: pip install pandas pyarrow numpy requests python-dotenv boto3 exchange-calendars yfinance

      - name: Resolve current NYSE session
        id: session
        run: python scripts/check_discretionary_focus_session.py

      - name: Pull current research inputs and prior delivery receipt
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/pull_discretionary_focus_inputs.py

      - name: Refresh isolated overflow prices locally
        # The Focus builder clips this cache to master_prices' broadly-covered
        # completed session. Keeping today's completed bar is required for an
        # after-close manual diagnostic once master_prices has advanced.
        run: python scripts/build_overflow_prices.py --no-upload

      - name: Refresh isolated overflow earnings coverage
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: >-
          python scripts/build_earnings_calendar.py
          --overflow-staging
          --fail-on-fetch-errors
          --no-upload

      - name: Build the final 0-2 name research shortlist
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: >-
          python scripts/build_discretionary_focus.py
          --phase ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_mode == 'dry_run' && 'PROVISIONAL' || 'FINAL' }}
          --fetch-news
          --output data/discretionary_focus/current.json

      - name: Gate publication and delivery to the actual pre-market window
        id: delivery
        if: >-
          github.ref == 'refs/heads/main' &&
          inputs.delivery_mode == 'publish_and_email'
        run: >-
          python scripts/check_discretionary_focus_session.py
          --delivery-window
          --require-allowed

      - name: Publish immutable history, then atomically replace current
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.delivery.outputs.should_run == 'true' &&
          inputs.delivery_mode == 'publish_and_email'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python scripts/publish_discretionary_focus.py
          --input data/discretionary_focus/current.json

      - name: Send the at-most-once morning email
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.delivery.outputs.should_run == 'true' &&
          inputs.delivery_mode == 'publish_and_email'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          DISCRETIONARY_FOCUS_RECIPIENTS: ${{ vars.DISCRETIONARY_FOCUS_RECIPIENTS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python scripts/send_discretionary_focus_email.py
          --input data/discretionary_focus/current.json
          --receipt data/discretionary_focus/email_receipt.json
          --persist-receipt-r2
