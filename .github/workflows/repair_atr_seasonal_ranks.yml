name: Repair ATR Seasonal Ranks

# Manual, cloud-only repair for the target-year lookahead found in August 2026.
# Canonical price/rank inputs come from R2. The existing ticker universe is
# preserved, every target year is recomputed with the corrected builder, and
# the canonical R2 key is replaced only after fail-closed validation.

on:
  workflow_dispatch:
    inputs:
      rebuild_site:
        description: "Rebuild the ledger and private site from the corrected R2 ranks"
        type: boolean
        default: true

concurrency:
  # One mutex for every workflow that can replace the canonical rank key.
  group: atr-seasonal-rank-writer
  cancel-in-progress: false

jobs:
  rebuild-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Pull authoritative inputs and current rank universe from R2
        run: |
          python -c "from cache_io import download_to_local as d; assert d('master_prices.parquet','data/master_prices.parquet'); assert d('atr_seasonal_ranks.parquet','atr_seasonal_ranks.parquet'); d('overflow_prices.parquet','data/overflow_prices.parquet'); d('symbol_master.parquet','data/symbol_master.parquet')"
          cp atr_seasonal_ranks.parquet atr_seasonal_ranks.baseline.parquet

      - name: Prove target-year mutation invariance
        run: python -m pytest tests/test_atr_seasonal_rank_lookahead.py -q

      - name: Recompute every existing ticker and target year
        run: python build_atr_seasonal_ranks.py --full --with-symbol-master --rebuild-existing --no-download

      - name: Validate repaired artifact and write provenance manifest
        run: |
          ATR_END_YEAR=$(python -c "from build_atr_seasonal_ranks import DEFAULT_YEAR; print(DEFAULT_YEAR)")
          ATR_START_YEAR=$(python -c "from build_atr_seasonal_ranks import FULL_START_YEAR; print(FULL_START_YEAR)")
          SOURCE_ARGS=(--source data/master_prices.parquet)
          if [ -f data/overflow_prices.parquet ]; then SOURCE_ARGS+=(--source data/overflow_prices.parquet); fi
          python scripts/validate_atr_seasonal_ranks.py --baseline atr_seasonal_ranks.baseline.parquet --start-year "$ATR_START_YEAR" --end-year "$ATR_END_YEAR" "${SOURCE_ARGS[@]}"

      - name: Publish corrected artifact and manifest to R2
        run: |
          python -c "import os; from cache_io import upload_from_local as u; run=os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']; prefix='repairs/atr_seasonal_ranks/'+run; assert u('atr_seasonal_ranks.baseline.parquet',prefix+'/baseline.parquet'); assert u('atr_seasonal_ranks.parquet',prefix+'/repaired.parquet'); assert u('atr_seasonal_ranks.meta.json',prefix+'/manifest.json'); assert u('atr_seasonal_ranks.parquet','atr_seasonal_ranks.parquet'); assert u('atr_seasonal_ranks.meta.json','atr_seasonal_ranks.meta.json')"

  deploy-site:
    needs: rebuild-ranks
    if: ${{ inputs.rebuild_site }}
    uses: ./.github/workflows/deploy_site.yml
    secrets: inherit
