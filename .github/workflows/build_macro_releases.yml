name: Build Macro Release History
run-name: "Build Macro Release History - ${{ inputs.automation_token || 'manual' }}"

# Official U.S. reported values and timestamps; frozen historical captures retained.
# No FMP dependency, consensus generation or historical backfill.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  LOCAL_AUTOMATION_STRICT: '1'

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas pyarrow requests boto3==1.43.23 python-dotenv beautifulsoup4 lxml -r requirements-official-data.txt

      - name: Build + upload macro release history
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/refresh_macro_releases.py
