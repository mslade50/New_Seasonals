name: Nightly Execution Report

# 4:30 PM ET email of live primary-account positions (site Execution tab mirror).
# Two crons cover both DST regimes; daily_execution_report.py picks the sender
# by which cron fired (GHA_SCHEDULE) + the date's DST regime, so exactly one
# sends each day even when GHA's cron queue starts the run an hour+ late.
# Cron strings must match EDT_CRON / EST_CRON in daily_execution_report.py.

on:
  schedule:
    - cron: '30 20 * * 1-5'  # sends while EDT (summer); gated off in EST
    - cron: '30 21 * * 1-5'  # sends while EST (winter); gated off in EDT
  workflow_dispatch:

jobs:
  execution_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests boto3

      - name: Run execution report
        env:
          EXEC_BROKER_URL: ${{ secrets.EXEC_BROKER_URL || 'https://execution-broker.mckinleyslade.workers.dev' }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECIPIENTS: ${{ vars.EXECUTION_REPORT_RECIPIENTS || 'mckinleyslade@gmail.com' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GHA_SCHEDULE: ${{ github.event.schedule }}
        # Manual dispatches bypass the DST-twin gate.
        run: python daily_execution_report.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
