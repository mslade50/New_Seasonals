name: Nightly Execution Report
run-name: "Nightly Execution Report — ${{ inputs.automation_token || 'manual' }}"

# Dispatch-only backup for the 4:30 PM ET local Task Scheduler email of live
# primary-account positions (site Execution tab mirror). The controller owns
# the ET schedule, so this remote path explicitly bypasses the retired UTC
# twin-cron gate with --force.

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

env:
  LOCAL_AUTOMATION_STRICT: '1'

jobs:
  execution_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests boto3

      - name: Run execution report
        env:
          EXEC_BROKER_URL: ${{ secrets.EXEC_BROKER_URL || 'https://execution-broker.mckinleyslade.workers.dev' }}
          STATUS_TOKEN: ${{ secrets.STATUS_TOKEN }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RECIPIENTS: ${{ vars.EXECUTION_REPORT_RECIPIENTS || 'mckinleyslade@gmail.com' }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # Dispatch-only backup runs once at the controller-selected ET slot.
        run: python daily_execution_report.py --force
