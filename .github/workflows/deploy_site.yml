name: Deploy Private Site

# R2-only production pipeline for the private analytics site. The repository
# checkout is source code only: both build workspaces are staged without
# data/, dist/, charts/, local credentials, or generated artifacts.
#
# generator: R2 canonical inputs -> ledger / ideas / risk -> immutable R2 bundle
# assembler: R2 canonical inputs + that exact R2 bundle -> dist/ -> Pages
#
# Cloudflare's independent Git deployments are disabled and verified below, so
# this workflow is the sole production path.
#
# Trigger: invoked as a REUSABLE WORKFLOW (workflow_call) from a dependent
# `deploy-site` job at the tail of daily_screener.yml (needs: run-scanner),
# so the rebuild runs in the SAME run as the scan and is guaranteed to start
# only after the scanner job succeeds. This replaces the old workflow_run
# chain, which is best-effort and was silently failing to fire — incompatible
# with the "must run after the scan" guarantee we need. Two scanner runs per
# trading day (AM dispatch + PM bookend) => two fresh rebuilds; a skipped or
# failed scan skips the deploy and the previous deploy stays up.
#
# workflow_dispatch is retained for manual / ad-hoc rebuilds.

concurrency:
  # Literal group (not ${{ github.workflow }}) so chained + manual deploys
  # serialize into the SAME queue regardless of how they were invoked — when
  # called via workflow_call, github.workflow resolves to the CALLER's name.
  group: deploy-private-site
  cancel-in-progress: false

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      full_chart_rebuild:
        description: "Re-render ALL signal charts (drop --skip-existing). One-time use after a chart-style change; normal runs stay incremental."
        type: boolean
        default: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      PRIVATE_SITE_CLOUD_BUILD: "1"
      GENERATOR_ROOT: generator
      ASSEMBLER_ROOT: assembler
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: source

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r source/requirements.txt

      - name: Refuse Cloudflare Git auto-deploy bypass
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python source/scripts/cloudflare_pages_guard.py check

      - name: Stage data-free generator workspace
        run: python source/scripts/stage_private_site_cloud_build.py --source source --dest "$GENERATOR_ROOT"

      - name: Pull generator inputs from R2 (fail closed)
        working-directory: generator
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py pull --phase generator --root .

      - name: Build full-history trade ledger
        working-directory: generator
        # R2 env needed: build_trade_ledger mirrors the ledger to R2 for
        # daily_scan's sector_loss_gate (without it the upload silently
        # no-ops and the gate reads a stale ledger). --upload is required:
        # this pipeline is the only sanctioned writer of the prod ledger key;
        # local runs (refresh_view) build but never upload (2026-07-06 fix
        # after an unattributed weekend vintage drove live gate blocks).
        env:
          OVERFLOW_UNIVERSE_ACTIVE: "0"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/build_trade_ledger.py --upload

      - name: Render signal charts -> R2 (incremental, or full on dispatch flag; best effort)
        working-directory: generator
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ "${{ github.event.inputs.full_chart_rebuild }}" = "true" ]; then
            echo "FULL chart rebuild: re-rendering ALL charts (no --skip-existing)"
            python scripts/build_signal_charts.py --all --upload
          else
            python scripts/build_signal_charts.py --all --upload --skip-existing
          fi

      - name: Build daily seasonal ideas (required freshness input)
        working-directory: generator
        env:
          OVERFLOW_UNIVERSE_ACTIVE: "0"
          # R2 creds so the forward track-record ledger syncs: without them
          # seasonal_ideas_ledger starts empty each run and never uploads, so
          # the out-of-sample log of emitted tickets silently failed to
          # accumulate from GHA (found 2026-07-24: "total 1" every run).
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python daily_seasonal_ideas.py

      - name: Refresh ATR downside stats (best effort — full-history signal tables for the risk tab)
        working-directory: generator
        run: python scripts/build_atr_downside_stats.py

      - name: Build nightly SPY beta table (best effort — hedge panel input)
        working-directory: generator
        continue-on-error: true
        run: python scripts/build_betas.py

      - name: Build risk summary JSON (required R2 bundle input)
        working-directory: generator
        run: python scripts/build_risk_json.py

      - name: Publish immutable generated bundle to R2
        working-directory: generator
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py publish-generated --root . --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Stage data-free assembler workspace
        run: python source/scripts/stage_private_site_cloud_build.py --source source --dest "$ASSEMBLER_ROOT"

      - name: Pull exact deployment inputs back from R2
        working-directory: assembler
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py pull --phase assembler --root . --run-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Build site from R2-provenanced inputs
        working-directory: assembler
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
          OVERFLOW_UNIVERSE_ACTIVE: "0"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/build_site.py --production

      - name: Refuse stale, incomplete, or unprovenanced site data
        working-directory: assembler
        run: python scripts/validate_site_freshness.py --out dist --require-r2-provenance

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: assembler
          # The Pages config exists only in the isolated assembler workspace.
          command: pages deploy --project-name=seasonals-mslade --branch=main
