name: Tests

# Runs the pytest guard suite on every push — the tests/ directory guards
# live-money invariants (sizing overlays, fill windows, caps, blackouts) but
# no workflow ever executed it before 2026-07-16, so guards only fired when
# someone remembered to run them by hand (the suite sat red for weeks).
# Data-dependent tests skip themselves when local parquets are absent;
# tests needing the OneDrive execution dir skip on the runner.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Browser and Worker contract tests
        run: node scripts/test_js.mjs

      - name: Run test suite
        run: python -m pytest tests/ -q

  windows-contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Windows process and allocation contracts
        run: python -m pytest tests/test_broker_runtime_fixes.py tests/test_execution_ops_fixes.py tests/test_tagged_inventory.py tests/test_strategy_discovery.py tests/test_strategy_research_launcher.py tests/test_strategy_research_runtime.py tests/test_strategy_research_checkpoint.py tests/test_local_automation_powershell.py tests/test_scan_holiday_settlement.py -q
