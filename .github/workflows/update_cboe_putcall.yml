name: Update CBOE Put/Call Cache
run-name: "Update CBOE Put/Call Cache — ${{ inputs.automation_token || 'manual' }}"

# Scrapes any missing trading days from cboe.com/us/options/market_statistics/daily
# into data/cboe_putcall.parquet and publishes the canonical object to R2.
# Powers the bottom panel of the SPX Breadth page (pages/spx_breadth.py).
#
# The backfill in cboe_putcall.py is incremental — it only fetches dates not
# already in the cache, so steady-state cost is ~1 request per weekday.
#
# TWO runs a day (AM added 2026-08-06):
#   PM  21:30 UTC (5:30 PM ET) — measured too early to see the SAME day's
#       page, so it only ever captures D-1. Kept because it is the backstop.
#   AM  ~4:10 AM ET via local workflow_dispatch — picks up the prior session
#       once CBOE has published overnight, so consumers running later that
#       morning see D-1 instead of D-2.
# Why the AM run matters: at 7 AM the newest row used to be two business days
# behind the session being traded, purely because the only scrape fired before
# CBOE published. Live band selection is UNAFFECTED either way — pc_fear
# selects by DATA date (newest row <= signal date - 1 bday), and the AM scan
# already gets exactly the row that rule wants — so this is a freshness win
# for later consumers, not a change to sizing.
#
# --assert-fresh-bd 2 fails the run loudly when the newest row is more than
# 2 business days old (steady state is 1 for both runs; a single market
# holiday adds 1, and an AM run that finds CBOE has not published yet leaves
# age 2, which still passes). Without it a CBOE markup change is a silent
# green no-op forever (the radar-digest failure class). A red run loses
# nothing: fetched-but-uncommitted rows are refetched next run.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LOCAL_AUTOMATION_STRICT: '1'

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas pyarrow boto3 python-dotenv

      - name: Pull canonical CBOE state from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: >-
          python scripts/automation_supervisor.py _r2-download
          cboe_putcall.parquet data/cboe_putcall.parquet --required

      - name: Backfill missing days
        run: python -m cboe_putcall --start 2024-01-01 --assert-fresh-bd 2

      - name: Publish private-site put/call input to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py publish-group --group cboe
