name: Update CBOE Put/Call Cache

# Scrapes any missing trading days from cboe.com/us/options/market_statistics/daily
# into data/cboe_putcall.parquet and commits the updated parquet back to main.
# Powers the bottom panel of the SPX Breadth page (pages/spx_breadth.py).
#
# The backfill in cboe_putcall.py is incremental — it only fetches dates not
# already in the cache, so steady-state cost is ~1 request per weekday.
#
# TWO runs a day (AM added 2026-08-06):
#   PM  21:30 UTC (5:30 PM ET) — measured too early to see the SAME day's
#       page, so it only ever captures D-1. Kept because it is the backstop.
#   AM  ~4:10 AM ET via local workflow_dispatch — picks up the prior session
#       once CBOE has published overnight, so consumers running later that
#       morning see D-1 instead of D-2.
# Why the AM run matters: at 7 AM the newest row used to be two business days
# behind the session being traded, purely because the only scrape fired before
# CBOE published. Live band selection is UNAFFECTED either way — pc_fear
# selects by DATA date (newest row <= signal date - 1 bday), and the AM scan
# already gets exactly the row that rule wants — so this is a freshness win
# for later consumers, not a change to sizing.
#
# --assert-fresh-bd 2 fails the run loudly when the newest row is more than
# 2 business days old (steady state is 1 for both runs; a single market
# holiday adds 1, and an AM run that finds CBOE has not published yet leaves
# age 2, which still passes). Without it a CBOE markup change is a silent
# green no-op forever (the radar-digest failure class). A red run loses
# nothing: fetched-but-uncommitted rows are refetched next run.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # 21:30 UTC = 5:30 PM ET — after close, alongside earnings + portfolio jobs.
    - cron: '30 21 * * 1-5'
    # AM fallback: 9:20 UTC (5:20 AM EDT / 4:20 AM EST). Only runs if the
    # local workflow_dispatch at 4:10 AM ET didn't fire today; the `check`
    # job below skips it otherwise. Deliberately NOT in the 8-9 UTC window,
    # where GitHub's shared scheduler queues for 1-3h (the same reason the
    # other AM jobs are dispatched locally).
    - cron: '20 9 * * 1-5'

  # Pre-market refresh (4:10 AM ET weekdays, ahead of the 4:17 master-prices
  # dispatch, the 4:30 risk correction and the 4:47 scan) is fired via
  # workflow_dispatch from C:\Scripts\trigger_cboe_putcall.ps1.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - name: Decide whether to run
        # Only the AM fallback cron is gated — dispatch and the PM cron
        # always run.
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHOULD_RUN=true
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "20 9 * * 1-5" ]; then
            TODAY=$(date -u +%Y-%m-%d)
            # Only count a dispatch inside the AM pre-market window (local
            # trigger fires 4:10 AM ET = 08:10 UTC EDT / 09:10 UTC EST).
            # Whole-UTC-day keying let a prior-EVENING manual dispatch —
            # which can only ever capture D-1, CBOE hasn't published yet —
            # suppress this fallback, leaving the 7 AM Daily Pitch on D-2
            # put/call data. Same bug class fixed in daily_screener.yml.
            COUNT=$(gh run list \
              --workflow=update_cboe_putcall.yml \
              --status=success \
              --event=workflow_dispatch \
              --created="${TODAY}T07:00Z..${TODAY}T09:20Z" \
              --repo "${{ github.repository }}" \
              --json databaseId --jq 'length')
            if [ "$COUNT" -gt 0 ]; then
              echo "::notice::Local AM dispatch already succeeded today ($COUNT run). Skipping fallback."
              SHOULD_RUN=false
            else
              echo "::notice::No successful AM dispatch found. Running fallback."
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  update:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas pyarrow boto3 python-dotenv

      - name: Backfill missing days
        run: python -m cboe_putcall --start 2024-01-01 --assert-fresh-bd 2

      - name: Publish private-site put/call input to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py publish-group --group cboe

      - name: Commit + push updated parquet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cboe_putcall.parquet
          if git diff --cached --quiet; then
            echo "No CBOE put/call change to commit."
          else
            git commit -m "data: CBOE put/call refresh $(date -u +'%Y-%m-%d')"
            # Rebase, verify the push landed, and fail loudly if it did not so a
            # lost push (racing the other 21:30 UTC bot commits) is visible rather
            # than silently swallowed by `|| true`.
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase origin main || true
              if git push; then pushed=true; break; fi
              echo "push attempt $attempt rejected; re-rebasing and retrying."
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::failed to push cboe_putcall.parquet after 3 attempts"
              exit 1
            fi
          fi
