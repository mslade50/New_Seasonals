name: Daily Risk Report
run-name: "Daily Risk Report (${{ inputs.mode || 'full' }}) — ${{ inputs.automation_token || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string
      mode:
        description: "full (email) or data_only (AM price correction)"
        type: choice
        options: [full, data_only]
        default: full

permissions:
  contents: write

jobs:
  risk_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install kaleido

      - name: Run risk report
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          RUN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RUN_MODE" = "data_only" ]; then
            python daily_risk_report.py --data-only --refresh-last
          else
            python daily_risk_report.py
          fi

      - name: Publish private-site risk inputs to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py publish-group --group risk

      - name: Commit updated data caches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rd2_fragility.parquet data/rd2_environment.json
          git add data/rd2_fragility_simple.parquet data/dial_sleeve_paper.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No fragility change to commit."
          else
            git commit -m "Detailed Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # This push races the 21:32 UTC CBOE commit. A bare push loses to a
            # non-fast-forward and silently strands rd2_fragility.parquet at
            # yesterday's values, which daily_scan reads to size every order.
            # Rebase, verify the push landed, and fail the job loudly if it did not.
            pushed=false
            for attempt in 1 2 3; do
              # --autostash: the run leaves other tracked caches (e.g.
              # rd2_spy_ohlc.parquet) dirty, which otherwise blocks the rebase
              # and defeats this retry loop exactly when the race happens.
              git pull --rebase --autostash origin main || true
              if git push; then pushed=true; break; fi
              echo "push attempt $attempt rejected; re-rebasing and retrying."
              sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "::error::failed to push rd2_fragility.parquet after 3 attempts — live sizing would read stale fragility"
              exit 1
            fi
          fi
