name: Fundamental Sleeve Research (Manual)

# Phase one is manual and research-only.  Do not add a schedule or live-order
# step until the shadow-operation and sleeve-attribution gates are approved.
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Sector/size-balanced companies to statement-enrich this run
        required: true
        default: '75'
      sec_limit:
        description: Maximum companies in the batch to tie to SEC companyfacts
        required: true
        default: '10'

concurrency:
  group: fundamental-sleeve-research
  cancel-in-progress: false

jobs:
  build-research-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install bounded dependencies
        run: pip install pandas pyarrow numpy requests python-dotenv boto3 yfinance pytest
      - name: Pull symbol and adjusted-price inputs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/pull_fundamental_inputs.py
      - name: Print the dry-run research plan
        run: >-
          python scripts/run_fundamental_sleeve.py
          --batch-size ${{ inputs.batch_size }}
          --sec-limit ${{ inputs.sec_limit }}
      - name: Execute bounded local research loop
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FUNDAMENTAL_SEC_USER_AGENT: ${{ secrets.FUNDAMENTAL_SEC_USER_AGENT }}
        run: >-
          python scripts/run_fundamental_sleeve.py
          --execute --refresh --refresh-prices
          --batch-size ${{ inputs.batch_size }}
          --sec-limit ${{ inputs.sec_limit }}
      - name: Confirm research-only posture
        run: python scripts/validate_fundamental_run_manifest.py
