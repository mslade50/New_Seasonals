name: Daily Portfolio Report
run-name: "Daily Portfolio Report — ${{ inputs.automation_token || 'manual' }}"

# Generates the daily portfolio health report (12-month backtest of the
# full strategy book + open-positions snapshot). Sends an HTML email with
# chart attachment and writes the open positions to the Portfolio Google
# Sheets tab.
#
# Replaces the local Task Scheduler entry (run_daily_portfolio_report.ps1).

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy yfinance gspread google-auth boto3 streamlit plotly matplotlib kaleido

      - name: Pull caches from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        # Fail-closed on load-bearing keys (was an unchecked inline pull —
        # a partial failure sent a silently degraded report while green).
        run: python scripts/pull_scan_caches.py --set report

      - name: Run portfolio report
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # Overflow universe gate. "1" = comprehensive (dynamic ∪ static, ~1,351);
          # "0" = legacy static tier (~870). Currently REVERTED to static — flip to
          # "1" to re-activate the comprehensive universe live.
          OVERFLOW_UNIVERSE_ACTIVE: "0"
        run: python daily_portfolio_report.py
