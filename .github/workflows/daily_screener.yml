name: Daily Strategy Scan (Liquid + Overflow)

# Pre-market and post-close bookend scans only — intraday MOC slots were
# retired when the strategy book lost its last MOC entry. Add them back if
# a Signal Close strategy is reintroduced.
run-name: "Daily Strategy Scan (${{ inputs.bookend || 'am' }}) — ${{ inputs.automation_token || 'manual' }}"

# Unified scan: each run hits LIQUID_PLUS_COMMODITIES (190 tickers) AND
# the overflow universe CSV_UNIVERSE − LIQUID_PLUS_COMMODITIES (~870
# tickers). Liquid signals -> Order_Staging tab, overflow -> Overflow tab.
# One combined email per run.
#
# Replaces both the legacy liquid-only daily_screener AND the separate
# daily_overflow workflow.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  LOCAL_AUTOMATION_STRICT: '1'

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string
      bookend:
        description: 'AM writes exposure state; PM scans the completed close'
        required: true
        default: am
        type: choice
        options:
          - am
          - pm
      run_event_sleeve:
        description: 'Also stage the once-only event sleeve (AM only)'
        required: false
        default: true
        type: boolean
      deploy_after_scan:
        description: 'Run cloud-only private/shared site deploys after a successful scan'
        required: false
        default: true
        type: boolean

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow numpy yfinance gspread google-auth boto3

      - name: Pull caches from R2 (fail-closed for load-bearing keys)
        # scripts/pull_scan_caches.py: REQUIRED keys (master_prices,
        # earnings_calendar, atr_seasonal_ranks) fail this step — a broken
        # credential or missing key used to exit 0 and run the scan degraded
        # while the workflow stayed green. OPTIONAL keys (overflow_universe,
        # earnings_calendar_overflow, backtest_trades_full) warn and degrade
        # per their documented fail-open designs.
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LOCAL_AUTOMATION_STRICT: '1'
        run: python scripts/pull_scan_caches.py

      - name: Stage event sleeve (AM bookend only)
        # BEFORE the scan: the scan email's event-sleeve cards read the
        # actions json this step writes, and event staging must not depend
        # on scan success (isolation both ways — this step is best-effort
        # for the scan, and a scan crash can no longer skip event staging).
        # AM runs only: the PM bookend must not restage rows for a day that
        # already traded; event_sleeve.py refuses past 9:00 ET as a second
        # guard. A missed EXIT self-heals on the next AM run (state-driven
        # exits); a missed ENTRY is a skipped trade.
        if: inputs.bookend == 'am' && inputs.run_event_sleeve
        continue-on-error: true
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python event_sleeve.py

      - name: Run Automation Script
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LOCAL_AUTOMATION_STRICT: '1'
          # Overflow universe gate. "1" = comprehensive (dynamic ∪ static, ~1,351);
          # "0" = legacy static tier (~870). Currently REVERTED to static — flip to
          # "1" to re-activate the comprehensive universe live (the cache pulls + R2
          # creds above stay wired, so re-enabling is a one-character change).
          OVERFLOW_UNIVERSE_ACTIVE: "0"
        run: python daily_scan.py --scope=all --bookend="${{ inputs.bookend }}"

      - name: Publish private-site exposure input to R2 (AM bookend only)
        if: inputs.bookend == 'am'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/site_r2_pipeline.py publish-group --group exposure

  deploy-site:
    # Tail of the pipeline: rebuild + deploy the private analytics site in the
    # SAME run, only after the scanner job succeeds. Replaces the old
    # best-effort workflow_run chain — deploy_site.yml is now a reusable
    # workflow. `needs: run-scanner` means a skipped (AM fallback) or failed
    # scan also skips the deploy, leaving the previous deploy up.
    needs: run-scanner
    if: inputs.deploy_after_scan
    uses: ./.github/workflows/deploy_site.yml
    secrets: inherit

  deploy-shared-seasonals:
    # Rebuild the teammate-safe Seasonality site from the same fresh price
    # snapshot. The dedicated builder has a strict output allow-list and never
    # packages portfolio, order, execution, or research data.
    needs: run-scanner
    if: inputs.deploy_after_scan
    uses: ./.github/workflows/deploy_shared_seasonals.yml
    secrets: inherit
