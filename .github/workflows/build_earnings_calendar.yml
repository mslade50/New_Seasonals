name: Build Earnings Calendar
run-name: "Build Earnings Calendar — ${{ inputs.automation_token || 'manual' }}"

# Provider selection lives in config/earnings_calendar.json, shared with the
# pinned local runtime. Alpha retains FMP for actuals confirmation/fallback.
# Analyst-grade collection is retired; existing historical files are retained.
# Runs once per weekday after market close and before the daily_scan
# morning run that needs the freshest forward dates.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  LOCAL_AUTOMATION_STRICT: '1'

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas pyarrow requests boto3==1.43.23 python-dotenv

      - name: Build + upload earnings calendar
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/refresh_earnings_calendar.py
