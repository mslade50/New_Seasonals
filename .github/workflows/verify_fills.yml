name: Verify Fills (Post-Close)
run-name: "Verify Fills — ${{ inputs.automation_token || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      automation_token:
        description: 'Opaque token supplied by the guarded fallback controller'
        required: false
        default: ''
        type: string

env:
  LOCAL_AUTOMATION_STRICT: '1'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance gspread pandas numpy google-auth

      - name: Run fill verification
        env:
          GCP_JSON: ${{ secrets.GCP_JSON }}
        run: |
          python verify_fills.py
