<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Sign Test weekly scoreboard card</title>
  <desc id="desc">A dark weekly scorecard with ideas graded, average R, hit rate, and worst trade.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}
    .ink{fill:#F3F0E8}.muted{fill:#9B9A94}.accent{fill:#6E9DB5}.negative{fill:#C2665E}
  </style>
  <rect width="1600" height="900" fill="#111416"/>
  <rect x="96" y="76" width="1408" height="4" fill="#6E9DB5"/>
  <g transform="translate(100 121)" stroke="#6E9DB5" stroke-width="5" stroke-linecap="square">
    <path d="M0 0h24 M48 0h24M60-12v24 M96 0h24 M144 0h24M156-12v24 M192 0h24"/>
  </g>
  <text x="96" y="226" class="mono ink" font-size="68" font-weight="700">WEEKLY SCOREBOARD</text>
  <text x="1504" y="134" class="mono muted" font-size="21" text-anchor="end">WEEK ENDING YYYY-MM-DD</text>
  <text x="96" y="278" class="mono muted" font-size="24">fixed rules · losers included · nothing deleted</text>

  <g class="mono">
    <line x1="96" y1="354" x2="1504" y2="354" stroke="#343A3E" stroke-width="2"/>
    <line x1="96" y1="472" x2="1504" y2="472" stroke="#2A2F33" stroke-width="2"/>
    <line x1="96" y1="590" x2="1504" y2="590" stroke="#2A2F33" stroke-width="2"/>
    <line x1="96" y1="708" x2="1504" y2="708" stroke="#343A3E" stroke-width="2"/>

    <g class="muted" font-size="24" letter-spacing="2">
      <text x="120" y="430">IDEAS GRADED</text>
      <text x="120" y="548">AVG R</text>
      <text x="120" y="666">HIT RATE</text>
      <text x="860" y="430">WORST TRADE</text>
      <text x="860" y="548">UNPOSTED, GRADED</text>
      <text x="860" y="666">CORRECTIONS</text>
    </g>
    <g font-size="44" font-weight="700" text-anchor="end">
      <text x="700" y="430" class="ink">3</text>
      <text x="700" y="548" class="negative">−0.2R</text>
      <text x="700" y="666" class="ink">33%</text>
      <text x="1478" y="430" class="negative">−1.4R</text>
      <text x="1478" y="548" class="ink">0</text>
      <text x="1478" y="666" class="ink">0</text>
    </g>
  </g>

  <text x="96" y="788" class="mono muted" font-size="19">3 graded · source: public feed · pessimistic fill rules</text>
  <text x="96" y="842" class="mono ink" font-size="22">all still up on the feed.</text>
  <text x="1504" y="842" class="mono ink" font-size="19" font-weight="700" text-anchor="end">@equities_stuff</text>
</svg>

