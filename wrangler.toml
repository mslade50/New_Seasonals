# Intentionally non-deployable from the repository checkout.
#
# The private-site Pages config is generated only inside the data-free GitHub
# Actions workspaces by scripts/stage_private_site_cloud_build.py.  Keeping a
# pages_build_output_dir here made `npx wrangler pages deploy` silently package
# the workstation's local dist/ directory.  The official deploy workflow is
# the only supported production path.
name = "seasonals-mslade-local-disabled"
compatibility_date = "2026-06-01"
